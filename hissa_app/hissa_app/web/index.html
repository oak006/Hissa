<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- The Flutter template omits this; without it the loading screen is laid
       out at 980px and scaled down before the engine takes over. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Hissa — own your share. Fractional US stock investing for Egypt.">
  <meta name="theme-color" content="#142D70">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hissa">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hissa</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
      Branded loading screen. Flutter's engine takes a few seconds to boot on
      the web, and the default is a blank page — a bad first second in front of
      judges. This paints the logo immediately from plain HTML, then hands over
      on the engine's first frame.

      The only thing it loads is the wordmark PNG, served from this same
      origin alongside the app — no webfont, no CDN, nothing off-box.
    */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #142D70;
    }

    #hissa-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #1C3E96 0%, #17337F 55%, #101F52 100%);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      opacity: 1;
      transition: opacity 420ms ease;
    }

    #hissa-loader.hissa-done {
      opacity: 0;
      pointer-events: none;
    }

    /* The wordmark ships as a transparent PNG, so it sits on the gradient
       and is pixel-identical to the one the app itself draws a moment later. */
    .hissa-wordmark {
      width: min(62vw, 320px);
      /* height:auto so the intrinsic height attribute cannot stretch it;
         aspect-ratio reserves the box before the image lands. */
      height: auto;
      aspect-ratio: 1446 / 493;
      animation: hissa-rise 700ms cubic-bezier(0.2, 0.9, 0.3, 1.4) both;
    }

    .hissa-tagline {
      margin-top: 14px;
      font-size: 16px;
      font-weight: 600;
      color: #E8A317;
      animation: hissa-rise 700ms 160ms cubic-bezier(0.2, 0.9, 0.3, 1.4) both;
    }

    .hissa-bar {
      margin-top: 42px;
      width: 132px;
      height: 3px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.16);
      overflow: hidden;
    }

    .hissa-bar span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 3px;
      background: #ffffff;
      animation: hissa-slide 1200ms ease-in-out infinite;
    }

    .hissa-note {
      position: absolute;
      bottom: 26px;
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.45);
    }

    @keyframes hissa-rise {
      from { opacity: 0; transform: translateY(14px) scale(0.9); }
      to   { opacity: 1; transform: none; }
    }

    @keyframes hissa-slide {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(360%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .hissa-wordmark, .hissa-tagline { animation: none; }
      .hissa-bar span { animation-duration: 2400ms; }
    }
  </style>
</head>
<body>
  <div id="hissa-loader">
    <img class="hissa-wordmark"
         src="assets/assets/brand/hissa_wordmark.png"
         width="1446" height="493" alt="Hissa">
    <div class="hissa-tagline">Own your share.</div>
    <div class="hissa-bar"><span></span></div>
    <div class="hissa-note">Illustrative demo build · no live market data</div>
  </div>

  <script>
    // Hand over as soon as Flutter paints. The timeout is a safety net so the
    // loader can never strand the app on screen.
    (function () {
      var removed = false;
      function dismiss() {
        if (removed) return;
        removed = true;
        var el = document.getElementById('hissa-loader');
        if (!el) return;
        el.classList.add('hissa-done');
        setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, 500);
      }
      window.addEventListener('flutter-first-frame', dismiss);
      setTimeout(dismiss, 20000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
